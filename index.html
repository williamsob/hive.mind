<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="Logo.svg">
  <link rel="stylesheet" href="styles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Meeting | Hivemind</title>
  <script src="./scripts/test.js" defer></script>
</head>
<body>

  <header class="top-bar">
    <img src="./images/Logo.svg" alt="Hivemind Logo" class="logo">
    <h1 class="page-title">hive.mind</h1>
  </header>

  <h2 class="section-title">Schedule a meeting</h2>

  <div class="container">

    <form class="meeting-form">
      <div class="input-with-icon">
        <img src="./images/Pencil.svg" alt="Pencil Icon" class="icon">
        <input type="text" placeholder="Give it a name...">
      </div>

      <div class="members-row">
        <input type="text" placeholder="Add members +">
        <input type="text" placeholder="Online">
      </div>

      <div class="date-input">
        <input type="text" placeholder="Thursday, 12th February 2026 - 15:00 PM">
      </div>

      <div class="repeat-row">
        <div class="repeat-box">
          <label for="repeat">Repeat</label>
          <input type="checkbox" id="repeat">
        </div>
      </div>
    </form>

    <p class="lobby-title">Lobby Chat</p>

    <div class="container2">
      <div class="lobby-footer">
        <img src="./images/icon.svg" alt="Avatar" class="avatar">
        <div class="message-content">
          <p class="coming-text">Who's coming...?</p>
          <span class="coming-time">12:28</span>
        </div>
      </div>
    </div>

    <div class="action-area">
      <button class="create-btn">Create</button>
      <div class="divider">
        <span></span>
        <p>or</p>
        <span></span>
      </div>
      <p class="draft-link">Save as Draft</p>
    </div>

  </div>

  <footer class="site-footer">
    <img src="./images/white logo.svg" alt="Hivemind Logo" class="footer-logo">
    <div class="footer-links">
      <div>Features</div>
      <div>Pricing</div>
      <div>Support</div>
      <div>About Us</div>
    </div>
  </footer>

</body>
</html>
