<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pomodoro</title>
  <link rel="stylesheet" href="main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #111111;
      --muted: #d9d9d9;
      --card: #000000;
      --tile: rgba(255, 215, 153, 0.14);
      --pill-a: #e11d1d;
      --pill-b: #1bb31b;
      --pill-f: #1f3dd3;
      --shadow: 0 4px 4px rgba(0, 0, 0, 0.25);
    }

    body {
      margin: 0;
      background: #ffffff;
      color: var(--ink);
      min-height: 100vh;
    }

    .pomodoro-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(24px, 4vw, 48px);
      position: relative;
      overflow: hidden;
    }

    .content {
      width: min(1000px, 90vw);
      display: grid;
      gap: clamp(6px, 1.6vw, 14px);
    }

    .top-row {
      display: flex;
      align-items: center;
      gap: clamp(14px, 2.6vw, 24px);
      margin-bottom: clamp(8px, 1.6vw, 16px);
    }

    .logo-tile {
      background: var(--tile);
      padding: clamp(14px, 2.6vw, 23px);
      border-radius: clamp(18px, 3vw, 30px);
      box-shadow: var(--shadow);
    }

    .logo-frame {
      width: clamp(54px, 6vw, 75px);
      height: clamp(54px, 6vw, 75px);
    }

    .logo-frame img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .session-title {
      font-size: clamp(18px, 2.4vw, 32px);
      letter-spacing: -0.03em;
      color: var(--ink);
      margin: 0;
    }

    .label {
      font-size: clamp(18px, 2.2vw, 32px);
      letter-spacing: -0.04em;
      line-height: 1.05;
      color: var(--muted);
    }

    .label.top {
      text-align: left;
      padding-left: clamp(0px, 4vw, 70px);
      margin: 0 0 clamp(4px, 0.8vw, 8px);
    }

    .label.bottom {
      text-align: right;
      padding-right: clamp(0px, 4vw, 70px);
      margin: clamp(4px, 0.8vw, 8px) 0 0;
    }

    .timer-card {
      position: relative;
      width: 100%;
      height: clamp(220px, 28vw, 385px);
      background: var(--card);
      border-radius: clamp(16px, 2vw, 20px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .time {
      color: #ffffff;
      font-size: clamp(96px, 20vw, 300px);
      letter-spacing: -0.03em;
      line-height: 1;
      font-weight: 400;
      width: 100%;
      text-align: center;
    }

    .pill-row {
      position: absolute;
      top: clamp(-16px, -2vw, -8px);
      right: clamp(10px, 2vw, 22px);
      display: flex;
      align-items: center;
    }

    .pill {
      width: clamp(34px, 4.5vw, 50px);
      height: clamp(34px, 4.5vw, 50px);
      border-radius: 50%;
      border: clamp(2px, 0.3vw, 3px) solid #ffffff;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-size: clamp(18px, 2.2vw, 32px);
      letter-spacing: -0.03em;
      font-weight: 500;
    }

    .pill + .pill { margin-left: clamp(-8px, -1vw, -6px); }
    .pill.a { background: var(--pill-a); }
    .pill.b { background: var(--pill-b); }
    .pill.f { background: var(--pill-f); }

    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(12px, 2vw, 20px);
    }

    .start-btn {
      background: #000000;
      color: #ffffff;
      border: none;
      border-radius: clamp(16px, 2vw, 20px);
      padding: clamp(10px, 1.4vw, 19px) clamp(44px, 6vw, 87px);
      font-size: clamp(22px, 3.2vw, 48px);
      letter-spacing: -0.03em;
      font-weight: 400;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .content { gap: 16px; }
      .label.top { padding-left: 0; }
      .label.bottom { padding-right: 0; }
      .pill-row { right: 8px; }
      .top-row { flex-wrap: wrap; }
      .bottom-row { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="pomodoro-page">
    <section class="content">
      <div class="top-row">
        <div class="logo-tile" aria-label="Logo">
          <div class="logo-frame">
            <img src="../resources/logo.svg" alt="" />
          </div>
        </div>
        <p class="session-title">Group Study Session</p>
      </div>

      <p class="label top">Topic of study</p>

      <div class="timer-card" aria-label="Timer card">
        <div class="pill-row" aria-label="Session types">
          <div class="pill a">A</div>
          <div class="pill b">B</div>
          <div class="pill f">F</div>
        </div>
        <div class="time" aria-label="Timer">30:00</div>
      </div>

      <div class="bottom-row">
        <button class="start-btn" type="button">Start</button>
        <p class="label bottom">Type of study session</p>
      </div>
    </section>
  </main>
</body>
</html>
