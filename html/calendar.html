<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../images/Logo.svg">
  <link rel="stylesheet" href="../styles/calendar.css">
  <title>Group Calendar | Hivemind</title>

  <script src="../scripts/returnToLogin.js"></script>
  <script src="../scripts/calendar.js" type="module" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="top-bar">
      <a href="./homepage.html" class="brand">
        <img src="../images/Logo.svg" alt="Hivemind logo" class="logo">
        <span class="brand-text">hive.mind</span>
      </a>

      <a href="./schedule.html" class="schedule-link">+ Schedule meeting</a>
    </header>

    <main class="calendar-page">
      <section class="hero-card">
        <div>
          <p class="eyebrow">Weekly overview</p>
          <h1>Group calendar</h1>
          <p id="calendarSubtitle" class="subtitle">
            Your past and upcoming study-group meetings in one weekly view.
          </p>
          <div id="groupList" class="group-list" aria-label="Your groups"></div>
        </div>

        <div class="week-controls" aria-label="Week navigation">
          <button id="prevWeek" class="nav-btn" type="button" aria-label="Show previous week">&lt;</button>
          <div class="week-meta">
            <span class="meta-label">Showing</span>
            <strong id="weekLabel">This week</strong>
          </div>
          <button id="nextWeek" class="nav-btn" type="button" aria-label="Show next week">&gt;</button>
        </div>
      </section>

      <section class="calendar-layout">
        <div class="panel calendar-panel">
          <div class="panel-heading">
            <h2>This week’s grid</h2>
            <button id="todayBtn" class="secondary-btn" type="button">Jump to this week</button>
          </div>

          <div class="calendar-scroll">
            <div id="calendar" class="calendar" role="grid" aria-live="polite"></div>
          </div>
        </div>

        <aside class="panel agenda-panel">
          <div class="panel-heading">
            <h2>Meetings this week</h2>
            <span id="meetingCount" class="count-pill">0 meetings</span>
          </div>

          <div id="meetingSummary" class="meeting-summary"></div>
        </aside>
      </section>
    </main>
  </div>
</body>
</html>
