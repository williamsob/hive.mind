<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Group Calendar</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 20px;
    }

    h1 { margin-bottom: 10px; }

    .top-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    .top-bar button {
        padding: 10px 15px;
        border: none;
        background: #ddd;
        cursor: pointer;
        border-radius: 6px;
    }

    #search {
        width: 300px;
        padding: 8px;
        margin-bottom: 15px;
    }

    .calendar {
        display: grid;
        grid-template-columns: 80px repeat(5, 1fr);
        border: 1px solid #ccc;
        background: white;
    }

    .cell, .time {
        border: 1px solid #ddd;
        height: 50px;
        position: relative;
    }

    .time {
        background: #fafafa;
        text-align: center;
        font-size: 12px;
        padding-top: 15px;
    }

    .day-header {
        background: #eaeaea;
        text-align: center;
        padding: 10px;
        font-weight: bold;
        border: 1px solid #ccc;
    }

    .meeting {
        position: absolute;
        left: 5%;
        width: 90%;
        border-radius: 6px;
        padding: 5px;
        color: white;
        font-size: 12px;
    }

    .group1 { background: #4CAF50; }
    .group2 { background: #E53935; }

    .availability-block {
        background: rgba(0,0,0,0.15);
        position: absolute;
        inset: 0;
    }

    #actions {
        margin-top: 15px;
        display: flex;
        gap: 10px;
    }

    #actions button {
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }

    #changeAvail { background: #d9534f; color: white; }
    #suggestMeeting { background: #0275d8; color: white; }
</style>
</head>
<body>

<h1>Group Calendar</h1>

<div class="top-bar">
    <button>Study Group Chat</button>
    <button>Pomodoro Timer</button>
    <button>Group Calendar</button>
</div>

<input id="search" placeholder="Search for friends by email or username...">

<div id="calendar" class="calendar"></div>

<div id="actions">
    <button id="changeAvail">Change meeting availability</button>
    <button id="suggestMeeting">Suggest Group Meeting</button>
</div>

<script>
/* -----------------------------
   CONFIG
------------------------------*/
const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
const startHour = 7;
const endHour = 16;

let availabilityMode = false;
let availability = {}; // { "Wednesday-10": true }

let meetings = [
    { day: "Wednesday", start: 10, end: 12, group: 1 },
    { day: "Thursday", start: 9, end: 11, group: 2 },
    { day: "Friday", start: 13, end: 14.5, group: 1 }
];

/* -----------------------------
   BUILD CALENDAR GRID
------------------------------*/
function buildCalendar() {
    const cal = document.getElementById("calendar");
    cal.innerHTML = "";

    cal.appendChild(document.createElement("div")); // empty corner

    days.forEach(d => {
        const h = document.createElement("div");
        h.className = "day-header";
        h.textContent = d;
        cal.appendChild(h);
    });

    for (let hour = startHour; hour < endHour; hour++) {
        const timeCell = document.createElement("div");
        timeCell.className = "time";
        timeCell.textContent = formatHour(hour);
        cal.appendChild(timeCell);

        days.forEach(day => {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.day = day;
            cell.dataset.hour = hour;

            if (availability[`${day}-${hour}`]) {
                const block = document.createElement("div");
                block.className = "availability-block";
                cell.appendChild(block);
            }

            cell.addEventListener("click", () => {
                if (availabilityMode) toggleAvailability(day, hour);
            });

            cal.appendChild(cell);
        });
    }

    renderMeetings();
}

/* -----------------------------
   RENDER MEETINGS
------------------------------*/
function renderMeetings() {
    meetings.forEach(m => {
        const cells = [...document.querySelectorAll(".cell")].filter(c =>
            c.dataset.day === m.day &&
            Number(c.dataset.hour) === Math.floor(m.start)
        );

        if (cells.length === 0) return;

        const cell = cells[0];
        const meetingDiv = document.createElement("div");
        meetingDiv.className = `meeting group${m.group}`;

        const duration = m.end - m.start;
        meetingDiv.style.top = ((m.start % 1) * 50) + "px";
        meetingDiv.style.height = (duration * 50) + "px";

        meetingDiv.textContent = `(group ${m.group}) ${duration} hr meeting`;
        cell.appendChild(meetingDiv);
    });
}

/* -----------------------------
   AVAILABILITY TOGGLE
------------------------------*/
function toggleAvailability(day, hour) {
    const key = `${day}-${hour}`;
    availability[key] = !availability[key];
    buildCalendar();
}

/* -----------------------------
   SUGGEST MEETING
------------------------------*/
function suggestMeeting() {
    for (let day of days) {
        for (let hour = startHour; hour < endHour - 1; hour++) {
            const slotFree =
                !availability[`${day}-${hour}`] &&
                !availability[`${day}-${hour + 1}`] &&
                !meetingExists(day, hour, hour + 1);

            if (slotFree) {
                alert(`Suggested meeting: ${day} at ${formatHour(hour)}–${formatHour(hour + 1)}`);
                return;
            }
        }
    }
    alert("No available 1-hour slots found.");
}

function meetingExists(day, start, end) {
    return meetings.some(m =>
        m.day === day &&
        !(m.end <= start || m.start >= end)
    );
}

/* -----------------------------
   HELPERS
------------------------------*/
function formatHour(h) {
    const suffix = h >= 12 ? "pm" : "am";
    const hour12 = (h % 12) || 12;
    return hour12 + suffix;
}

/* -----------------------------
   BUTTON EVENTS
------------------------------*/
document.getElementById("changeAvail").onclick = () => {
    availabilityMode = !availabilityMode;
    alert("Availability mode: " + (availabilityMode ? "ON" : "OFF"));
};

document.getElementById("suggestMeeting").onclick = suggestMeeting;

/* -----------------------------
   INIT
------------------------------*/
buildCalendar();
</script>

</body>
</html>
