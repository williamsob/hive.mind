<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="../images/Logo.svg">
  <link rel="stylesheet" href="../styles/schedule.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule Meeting | Hivemind</title>

  <script src="../scripts/returnToLogin.js"></script>
  
  <script src="https://cdn.jsdelivr.net/pyodide/v0.29.3/full/pyodide.js" async></script>

  <!-- <script src="../scripts/test.js" defer></script> -->
  <script src="../scripts/colourDropdownText.js" defer></script>
  <script src="../scripts/chooseGroup.js" defer type="module"></script>
  <script src="../scripts/addMembers.js" defer type="module"></script>
  <script src="../scripts/submitSchedule.js" defer type="module"></script>
  

  <!-- brython scripts loaded -->
  <!-- <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/brython@3.13.2/brython.min.js">
  </script>

  <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/brython@3.13.2/brython_stdlib.js">
  </script> -->

</head>
<body>

  <header class="top-bar" href="./homepage.html">
    <img src="../images/Logo.svg" alt="Hivemind Logo" class="logo" >
    <h1 class="page-title">hive.mind</h1>
  </header>

  <h2 class="section-title">Schedule a meeting</h2>

  <div class="container"> 
    <form id="meeting-form" class="meeting-form" method="post">
      <div id="meeting-form-inputs" class="meeting-form-input">
        <div class="input-with-icon">
          <img src="../images/Pencil.svg" alt="Pencil Icon" class="icon">
          <input id="meeting-name" type="text" placeholder="Give it a name..." required>
        </div>

        <div class="members-row">
          <select size='1' id="choose-group-dropdown" type="text" placeholder="Choose group to meet with" form="meeting-form">
            <option value="" selected disabled id="placeholder-option-2">Choose group +</option>
          </select>

          <select multiple size='1' id="add-members-dropdown" type="text" placeholder="Add members +" form="meeting-form">
            <option value="" selected disabled id="placeholder-option" required>Add members +</option>
          </select>
        </div>

        <div class="date-input">
          <input id="meeting-date-input" type="datetime-local" placeholder="Thursday, 12th February 2026 - 15:00 PM" required>
        </div>

        <div class="repeat-row">
          <div class="repeat-box">
            <label for="repeat">Repeat</label>
            <input type="checkbox" id="repeat">
          </div>
        </div>

      </div>

      <p class="lobby-title">Lobby Chat</p>

      <div class="container2">
        <div class="lobby-footer">
          <img src="../images/icon.svg" alt="Avatar" class="avatar">
          <div class="message-content">
            <p class="coming-text">Who's coming...?</p>
            <span class="coming-time">12:28</span>
          </div>
        </div>
      </div>

      <div class="action-area">
        <button id="create-meeting-btn" type="submit" class="create-btn" for="meeting-form">Create</button>
        <div class="divider">
          <span></span>
          <p>or</p>
          <span></span>
        </div>
        <p id="save-as-draft-btn" class="draft-link" for="meeting-form">Save as Draft</p>
      </div>
    </form>
  </div>

  <footer class="site-footer">
    <img src="../images/white logo.svg" alt="Hivemind Logo" class="footer-logo">
    <div class="footer-links">
      <div>Features</div>
      <div>Pricing</div>
      <div>Support</div>
      <div>About Us</div>
    </div>
  </footer>

</body>
</html>
